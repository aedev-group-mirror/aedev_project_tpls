image: python:{MIN_PYTHON_VERSION}

{TEMPLATE_PLACEHOLDER_ID_PREFIX}{TEMPLATE_INCLUDE_FILE_PLACEHOLDER_ID}{TEMPLATE_PLACEHOLDER_ID_SUFFIX}
  .gitlab-ci_include_service.yml
{TEMPLATE_PLACEHOLDER_ARGS_SUFFIX}

{TEMPLATE_PLACEHOLDER_ID_PREFIX}{TEMPLATE_INCLUDE_FILE_PLACEHOLDER_ID}{TEMPLATE_PLACEHOLDER_ID_SUFFIX}
  .gitlab-ci_include_variables.yml
{TEMPLATE_PLACEHOLDER_ARGS_SUFFIX}

.check_rules: &check-rules
  rules:
    - if: $CI_COMMIT_BRANCH == "{MAIN_BRANCH}"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release/
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

integrity:
  <<: *check-rules
  before_script:
    - python --version
    - pip --version
    - pip install --upgrade pip pipx setuptools
    - pip --version
    - >
      pip install --upgrade --force-reinstall --uploaded-prior-to={PYPI_COOLDOWN_PERIOD}
      -r {frozen_req_file_path()}
      {"-r " + frozen_req_file_path(_f_) if os_path_isfile(_f_ := TESTS_FOLDER + "/" + REQ_FILE_NAME) else ""}
    {"- pip install --upgrade --force-reinstall " + " ".join(_c_) if (_c_ := cooldown_excluded_projects) else ""}
  script:
    - pipx run --spec aedev_project_manager project-manager -v check-integrity
    - |
      if [ -d tests ]; then
        test -d htmlcov || {{ echo "CI-ERROR: tests/ exists, but htmlcov/ was not created"; exit 1; }}
        test -d .pytest_cache || {{ echo "CI-ERROR: tests/ exists, but .pytest_cache/ was not created"; exit 1; }}
      else
        mkdir -p htmlcov .pytest_cache
      fi
  artifacts:
    paths:
      - mypy_report/
      - .pylint/
      - htmlcov/
      - .pytest_cache/

pages:
  stage: deploy
  dependencies:
    - integrity
  <<: *check-rules
  script:
    - ls -l -R
    - mkdir -p public/coverage
    - |
      if [ -d tests ]; then
        cp -a -f -v htmlcov/. public/coverage/
        cp -a -f -v .pytest_cache/coverage.svg public/
      fi
    - cp -a -f -v mypy_report/lineprecision.txt public/
    - cp -a -f -v mypy_report/mypy.svg public/
    - cp -a -f -v .pylint/pylint.svg public/
    - cp -a -f -v .pylint/pylint.log public/
  artifacts:
    paths:
      - public


pypi_deploy:
  stage: deploy
  rules:
    # - if: $CI_COMMIT_TAG =~ /^v?[0-9]+[.][0-9]+([.][0-9]+)?$/
    # CI_COMMIT_TAG is only set if the push does contain a new tag (and no new commit); separate push and rules are
    # additionally creating duplicate jobs on gitlab CI - finally using release branch to trigger deploy.
    - if: $CI_COMMIT_BRANCH =~ /^release/
  variables:
    # the pushed branch has to be a protected branch in order to get the CI variables for the twine/PyPI authentication.
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
     - pip install --upgrade build pip twine
     - python -m build
  script:
    # use test.pypi.org for integration/unit test projects (if is under :data:`~aedev.base.TEST_PROJECTS_PARENT_FOLDER`)
    - twine upload {"--repository testpypi " if parent_folder == TEST_PROJECTS_PARENT_FOLDER else ""}--verbose dist/*
